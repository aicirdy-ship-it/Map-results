<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>LMIC Oral Health and Dementia Studies Globe</title>

  <script src="https://unpkg.com/globe.gl"></script>
  

 <style>

  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f5f5f0;
  }

  #globeViz {
    width: 100vw;
    height: 100vh;
  }

  #legend {
    position: absolute;
    top: 20px;
    left: 20px;

    background: rgba(255,255,255,0.96);

    padding: 18px 22px;

    border-radius: 14px;

    box-shadow: 0 3px 14px rgba(0,0,0,0.16);

    line-height: 1.55;

    z-index: 10;

    max-width: 340px;
  }

  .legend-title {

    font-size: 22px;
    font-weight: bold;
    margin-bottom: 16px;
    color: #222;
  }

  .legend-item {

    display: flex;
    align-items: flex-start;

    margin-bottom: 12px;

    font-size: 18px;
    color: #222;
  }

  .color-box {

    width: 18px;
    height: 18px;

    margin-right: 12px;
    margin-top: 3px;

    border-radius: 4px;

    flex-shrink: 0;
  }

  .legend-note {

    margin-top: 14px;

    font-size: 16px;

    color: #333;
  }

  .key-findings {

    margin-top: 22px;

    padding-top: 18px;

    border-top: 1px solid #ddd;

    font-size: 17px;

    line-height: 1.5;

    color: #8B0000;

    font-weight: 600;
  }

  /* PHONE VERSION */

  @media (max-width: 768px) {

    #legend {

      max-width: 88vw;

      padding: 20px 24px;
    }

    .legend-title {

      font-size: 28px;
    }

    .legend-item {

      font-size: 22px;
    }

    .legend-note {

      font-size: 20px;
    }

    .key-findings {

      font-size: 21px;
    }
  }
   .globe-tooltip {
  font-size: 18px !important;
  padding: 12px !important;
  border-radius: 10px !important;
}

@media (max-width: 768px) {

  .globe-tooltip {

    font-size: 24px !important;
  }
}

</style>
</head>

<body>

  <!-- LEGEND -->

  <div id="legend">

      <div class="legend-title">
    LMIC Dementia Studies
  </div>
    
    <div class="legend-item">
      <div class="color-box" style="background:red;"></div>
      Individual studies
    </div>

    <div class="legend-item">
      <div class="color-box" style="background:blue;"></div>
          WHO international surveys<br>
    (WHS / SAGE)
    </div>

    <div class="legend-item">
      <div class="color-box" style="background:purple;"></div>
       * Countries with both individual and WHS/SAGE data
    </div>

    <div class="legend-item">
      <div class="color-box" style="background:grey;"></div>
      High-income countries
    </div>
  <div class="key-findings">
    • Predominance of upper-middle-income countries.<br><br>

    • Evidence concentrated in Asia, with limited representation
    in Africa and South America.
  </div>
    
  </div>

  <div id="globeViz"></div>

  <script>

    // =========================
    // GLOBE SETUP
    // =========================

    const world = Globe()
      (document.getElementById('globeViz'))

      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg')

      .backgroundColor('#f5f5f0')

      .showAtmosphere(true)
      .atmosphereColor('#bcdcff')
      .atmosphereAltitude(0.18);

    // AUTO ROTATION

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;

    // =========================
    // HIGH-INCOME COUNTRIES
    // =========================

    const highIncome = [

      "USA",
      "Canada",
      "Australia",
      "New Zealand",
      "Japan",
      "South Korea",
      "Singapore",
      "Israel",

      "England",
      "Ireland",
      "France",
      "Germany",
      "Italy",
      "Spain",
      "Portugal",
      "Netherlands",
      "Belgium",
      "Luxembourg",
      "Switzerland",
      "Austria",
      "Norway",
      "Sweden",
      "Finland",
      "Denmark",
      "Iceland",

      "Poland",
      "Slovakia",
      "Slovenia",
      "Estonia",
      "Latvia",
      "Lithuania",
      "Greece",
      "Croatia",
      "Hungary",

      "Saudi Arabia",
      "United Arab Emirates",
      "Qatar",
      "Kuwait",
      "Bahrain",
      "Oman",

      "Chile",
      "Uruguay",

      "Taiwan"
    ];

    // =========================
    // FETCH GEOJSON
    // =========================

    fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')

      .then(res => res.json())

      .then(countries => {

        // =========================
        // INDIVIDUAL STUDIES
        // =========================

        const individualStudies = {

          China: 31,
          India: 11,
          Brazil: 8,
          Iran: 4,
          Indonesia: 3,
          Thailand: 2,
          Turkey: 2,
          Argentina: 1,
          Colombia: 1,
          Ecuador: 1,
          Mongolia: 1
        };

        // =========================
        // WHS / SAGE STUDIES
        // =========================

        const whsSageStudies = {

          Ghana: 3,
          Russia: 3,
          "South Africa": 3,

          Bangladesh: 2,
          "Burkina Faso": 2,
          Chad: 2,
          Comoros: 2,
          Ethiopia: 2,
          "Ivory Coast": 2,
          Kenya: 2,
          Laos: 2,
          Malawi: 2,
          Myanmar: 2,
          Nepal: 2,
          Pakistan: 2,
          Senegal: 2,
          Vietnam: 2,
          Zambia: 2,
          Zimbabwe: 2,

          Mauritania: 1,
          "Democratic Republic of the Congo": 1,
          Mali: 1,

          "Bosnia and Herzegovina": 2,
          Croatia: 2,
          "Czech Republic": 2,
          "Dominican Republic": 2,
          Estonia: 2,
          Georgia: 2,
          Hungary: 2,
          Kazakhstan: 2,
          Latvia: 2,
          Malaysia: 2,
          Mauritius: 2,
          Mexico: 1,
          Morocco: 2,
          Namibia: 2,
          Paraguay: 2,
          Philippines: 2,
          Slovakia: 1,
          "Sri Lanka": 2,
          Eswatini: 1,
          Tunisia: 1,
          Ukraine: 2,
          Uruguay: 2,

          // overlap countries

          China: 3,
          India: 3,
          Brazil: 2,
          Ecuador: 1
        };

        // =========================
        // OVERLAP COUNTRIES
        // =========================

        const overlapCountries = [

          "China",
          "India",
          "Brazil",
          "Ecuador"

        ];

        // =========================
        // PROCESS COUNTRIES
        // =========================

        countries.features.forEach(f => {

          const name = f.properties.name;

          const individual = individualStudies[name] || 0;
          const whs = whsSageStudies[name] || 0;

          f.properties.individual = individual;
          f.properties.whs = whs;

          f.properties.highIncome =
            highIncome.includes(name);

          // CATEGORY

          if (individual > 0 && whs > 0) {

            f.properties.category = 'both';

          } else if (individual > 0) {

            f.properties.category = 'individual';

          } else if (whs > 0) {

            f.properties.category = 'whs';

          } else if (f.properties.highIncome) {

            f.properties.category = 'highIncome';

          } else {

            f.properties.category = 'none';
          }

        });

        // =========================
        // DRAW GLOBE
        // =========================

        world

          .polygonsData(countries.features)

          .polygonCapColor(feat => {

            const individual = feat.properties.individual;
            const whs = feat.properties.whs;

            // BOTH = PURPLE

            if (feat.properties.category === 'both') {

              const intensity = Math.min(
                (individual + whs) / 35,
                1
              );

              return `rgba(140,70,180,${0.35 + intensity * 0.65})`;
            }

            // INDIVIDUAL = RED

            if (feat.properties.category === 'individual') {

              const intensity = Math.min(
                individual / 34,
                1
              );

              return `rgba(220,40,40,${0.25 + intensity * 0.75})`;
            }

            // WHS/SAGE = BLUE

            if (feat.properties.category === 'whs') {

              const intensity = Math.min(
                whs / 3,
                1
              );

              return `rgba(50,90,255,${0.25 + intensity * 0.75})`;
            }

            // HIGH-INCOME = GREY

            if (feat.properties.category === 'highIncome') {

              return 'rgba(95,95,95,0.7)';
            }

            // OTHER COUNTRIES

            return 'rgba(220,220,220,0.10)';
          })

          .polygonSideColor(() => 'rgba(0,0,0,0.03)')

          .polygonStrokeColor(() => 'rgba(255,255,255,0.18)')

      .polygonLabel(feat => {

            const name = feat.properties.name;

            const hasAsterisk =
              overlapCountries.includes(name) ? '*' : '';

            const individual = feat.properties.individual;
            const whs = feat.properties.whs;

            // INDIVIDUAL

            if (feat.properties.category === 'individual') {

              return `
                <b>${name}</b><br>
                Individual studies: ${individual}
              `;
            }

            // WHS/SAGE

            if (feat.properties.category === 'whs') {

              return `
                <b>${name}</b><br>
                WHS/SAGE studies: ${whs}
              `;
            }

            // BOTH

            if (feat.properties.category === 'both') {

              return `
                <b>${name}${hasAsterisk}</b><br>
                Individual studies: ${individual}<br>
                WHS/SAGE studies: ${whs}
              `;
            }

            // HIGH-INCOME

            if (feat.properties.category === 'highIncome') {

              return `
                <b>${name}</b><br>
                High-income country
              `;
            }

            return name;
          });

      });

  </script>

</body>

</html>
